name: Deployment Pipeline

on:
  push:
    branches:
      - stage
      - master

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=long

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          context: .

  deploy:
    name: Deploy to Environment
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy
        run: |
          echo "Deploying ${{ needs.build-and-push.outputs.image-tag }} to ${{ github.ref_name == 'master' && 'production' || 'staging' }} environment."
          # Add your cloud provider CLI commands here (e.g., aws ecs update-service, kubectl, etc.)
