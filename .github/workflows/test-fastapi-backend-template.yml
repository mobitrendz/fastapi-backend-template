name: Test FastAPI Backend Template

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test FastAPI Backend Template
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fastapi_template_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_template_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      FRONTEND_HOST: http://localhost:5173
      ENVIRONMENT: ci
      PROJECT_NAME: FastAPI Backend Template
      STACK_NAME: fastapi-backend-template-ci
      API_V1_STR: /api/v1
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      EMAIL_RESET_TOKEN_EXPIRE_HOURS: 48
      SUPER_USER_NAME: CI Admin
      SUPER_USER_EMAIL: admin@example.com
      SUPER_USER_PASSWORD: admin123
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: fastapi_template_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGADMIN_EMAIL: admin@example.com
      PGADMIN_PASSWORD: admin

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest
name: Run tests
        run: uv run pytest
