name: ⏰ Keep Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from sleeping (15m limit)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Sending Heartbeat
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://mobitrendz.onrender.com/health)
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "❌ Heartbeat failed with status: $STATUS_CODE"
            exit 1
          else
            echo "✅ Heartbeat successful: $STATUS_CODE"
          fi
