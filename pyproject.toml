[project]
name = "fastapi-backend-template"
version = "0.1.0"
description = "FastAPI learning project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.135.2",
    "psycopg[binary]>=3.3.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.12.1",
    "sqlmodel>=0.0.37",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "mypy>=1.20.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]
