[project]
name = "fastapi-backend-template"
version = "0.1.0"
description = "FastAPI learning project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4", # For database migrations, allowing for version control of the database schema and easy application of changes across different environments.
    "fastapi[standard]>=0.135.2", # For building the API with FastAPI
    "psycopg[binary]>=3.3.3", # For PostgreSQL database connectivity
    "pwdlib[argon2]>=0.3.0", # For password hashing
    "pydantic-settings>=2.13.1", # For managing application settings with validation
    "pydantic[email]>=2.12.5", # For email validation in user models
    "pyjwt>=2.12.1", # For JSON Web Token (JWT) handling, used for authentication and authorization in the application
    "sqlmodel>=0.0.37", # For SQLAlchemy-based ORM with Pydantic models, providing an easy way to define database models and perform CRUD operations
    "tenacity>=9.1.4", # For retrying operations with exponential backoff, useful for handling transient errors in database connections or external API calls
    "structlog>=25.1.0", # For structured logging, allowing for better log management and analysis
    "prometheus-fastapi-instrumentator>=7.0.2", # For Prometheus metrics instrumentation, enabling monitoring of the application's performance and behavior
    "slowapi>=0.1.9", # For rate limiting, helping to protect the application from abuse and ensure fair usage
    "fastapi-pagination>=0.12.34", # For pagination support in API endpoints, making it easier to handle large datasets and improve performance
    "python-multipart>=0.0.22", # For handling multipart form data, useful for file uploads and form submissions in the API
    "pydantic-extra-types>=2.11.1", # For additional Pydantic types, providing more options for data validation and serialization in the application
    "sentry-sdk>=2.56.0", # For error tracking and monitoring in the application
]

[dependency-groups]
lint = [
    "ruff>=0.15.11", # For linting and code quality checks, providing a fast and comprehensive linter for Python code
    "mypy>=1.20.1", # For static type checking, helping to catch type-related errors before runtime and improve code quality
    "bandit>=1.8.3", # For security linting, identifying common security issues in Python code and helping to improve the security posture of the application   
]
test = [
    "pytest>=9.0.2", # For testing the application, providing a powerful and flexible testing framework for writing unit tests, integration tests, and more
    "pytest-cov>=7.1.0", # For measuring test coverage, allowing for tracking how much of the codebase is covered by tests and identifying areas that may need additional testing
    "pytest-asyncio>=1.3.0", # For testing asynchronous code with pytest, enabling the testing of async functions and features in the application
    "httpx>=0.27.0", # For making HTTP requests in tests, useful for testing API endpoints and interactions with external services
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "debugpy>=1.8.20", # For debugging the application, providing a powerful debugger that can be used in various development environments
    "pre-commit>=4.1.0", # For managing pre-commit hooks, allowing for automated code checks and formatting before commits to maintain code quality and consistency
    "zensical>=0.0.34", # For managing secrets, providing a secure way to handle sensitive information like API keys and database credentials in development and production environments
]

[tool.ruff]
line-length = 88
target-version = "py314"
lint.select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG001", # unused arguments
    "S",    # bandit security
]
lint.ignore = ["E501"] # Line too long (handled by formatter)

[tool.mypy]
strict = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = "sqlmodel.*"
ignore_missing_imports = true

[tool.pytest]
addopts = ["--cov=app", "--cov-report=term-missing"]
testpaths = ["tests"]
python_files = ["test_*.py"]
