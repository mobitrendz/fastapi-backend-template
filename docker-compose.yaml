networks:
  proxy:
    driver: bridge

services:
  traefik:
    image: traefik:v3.3
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:-fastapi-template.test}`)"
      - "traefik.http.routers.traefik.service=api@internal"
    networks:
      - proxy

  db:
    image: postgres:18
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-fastapi_db}
      # FORCE Postgres to use the mounted path
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-fastapi_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ui
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_SESSION_EXPIRATION: 720
    ports:
      - "5050:80"
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.${DOMAIN:-fastapi-template.test}`)"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
    depends_on:
      - db

  prestart:
    build: .
    container_name: prestart_migrations
    # Absolute path to the script in the container
    entrypoint: ["/app/scripts/prestart.sh"]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=db
    volumes:
      - .:/app
      - /app/.venv  # Anonymous volume to protect the container's .venv
    depends_on:
      db:
        condition: service_healthy
        restart: true

  backend:
    build: .
    container_name: fastapi_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=db
    volumes:
      - .:/app
      - /app/.venv  # Anonymous volume to protect the container's .venv
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN:-fastapi-template.test}`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    healthcheck:
      # Requires a @app.get("/health") route in your FastAPI main.py
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
